<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vision">
<meta name="theme-color" content="#070a14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Vision Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a14; --s1:#0f1424; --s2:#171d33; --line:#222a44;
  --tx:#f4f6fb; --mut:#8e97b3;
  --netflix:#e50914; --prime:#1a98ff; --crunchy:#f47521;
  --ok:#35d487; --warn:#ffb21f; --bad:#ff4a5c;
  --grad:linear-gradient(110deg,#e50914,#0a3a8a);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --disp:'Unbounded',system-ui,sans-serif; --svc:#222a44;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:500 16px/1.4 'Figtree',system-ui,-apple-system,sans-serif;
  background:radial-gradient(120% 40% at 0% 0%,rgba(229,9,20,.16),transparent 60%),radial-gradient(120% 40% at 100% 0%,rgba(10,90,200,.2),transparent 60%),var(--bg);
  background-repeat:no-repeat;padding-top:var(--sat)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}

/* Marque */
.logo{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px;font-style:italic}
.logo small{font-family:'Figtree';font-weight:600;font-size:13px;color:var(--mut);font-style:normal;letter-spacing:0}
.boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:100}

/* Connexion */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:440px;margin:0 auto;gap:26px}
.login .logo{font-size:34px}
.login p{margin:0;color:var(--mut)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--mut)}
input,select,textarea{width:100%;background:var(--s2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:#4b6bff}
textarea{min-height:130px;resize:vertical;line-height:1.45}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0 0 8px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-weight:700;background:var(--s2);border:1.5px solid var(--line)}
.btn.primary{background:var(--grad);border-color:transparent}
.btn.danger{color:var(--bad);border-color:rgba(255,74,92,.4);background:transparent}
.btn.small{width:auto;padding:9px 13px;font-size:14px;border-radius:11px}

/* Structure */
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;max-width:600px;margin:0 auto}
main{max-width:600px;margin:0 auto;padding:6px 16px calc(150px + var(--sab))}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 12px calc(8px + var(--sab));background:rgba(7,10,20,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.tabs .in{display:flex;width:100%;max-width:600px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--mut);font-size:12px;font-weight:600}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--tx)}
.fab{position:fixed;right:18px;bottom:calc(84px + var(--sab));width:58px;height:58px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 10px 28px rgba(10,58,138,.55);z-index:21}
.fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2.6;stroke-linecap:round}

/* Indicateurs et filtres */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.stat{text-align:left;padding:12px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line)}
.stat.on{border-color:#4b6bff}
.stat b{display:block;font-family:var(--disp);font-size:24px;font-weight:700;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}
.stat.warn b{color:var(--warn)} .stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--s1);border:1.5px solid var(--line);font-size:14px;font-weight:600;color:var(--mut)}
.chip.on{color:var(--tx);border-color:transparent;background:var(--s2);box-shadow:inset 0 0 0 1.5px #4b6bff}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:var(--svc)}
.empty{text-align:center;color:var(--mut);padding:44px 20px}

/* Lignes d'abonnement : chaque service garde sa couleur */
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;margin-bottom:9px;background:var(--s1);border-radius:16px;overflow:hidden;cursor:pointer}
.row::before,.sub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--svc)}
.days{width:62px;flex:none;text-align:center}
.days b{display:block;font-family:var(--disp);font-size:26px;font-weight:700;line-height:1}
.days span{font-size:11.5px;color:var(--mut);font-weight:600}
.days.warn b{color:var(--warn)} .days.bad b{color:var(--bad)}
.row-main{flex:1;min-width:0}
.row-main strong{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:13px;color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:var(--svc)}
.wa{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#1fa855}
.wa svg{width:22px;height:22px;fill:#fff}
.wa.off{background:var(--s2);opacity:.5;pointer-events:none}
.client-line{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:9px;background:var(--s1);border-radius:16px;cursor:pointer}
.client-line .main{flex:1;min-width:0}
.client-line strong{display:block;font-size:17px}
.client-line small{color:var(--mut);font-size:13px}
.dots{display:flex;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--svc)}

/* Fiche client */
.page{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;padding:calc(var(--sat) + 8px) 0 calc(40px + var(--sab))}
.page .wrap{max-width:600px;margin:0 auto;padding:0 16px}
.back{display:flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;padding:10px 0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.who h1{margin:4px 0 2px;font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.15}
.who p{margin:0;color:var(--mut)}
.actions{display:flex;gap:8px;margin:16px 0 8px;flex-wrap:wrap}
.total{display:flex;gap:18px;margin:6px 0 4px;color:var(--mut);font-size:14px}
.total b{color:var(--tx)}
h2{font-size:15px;font-weight:700;color:var(--mut);margin:24px 0 10px}
.sub{position:relative;padding:14px 14px 14px 20px;margin-bottom:10px;background:var(--s1);border-radius:16px;overflow:hidden}
.sub .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--s2)}
.pill.warn{color:var(--warn);background:rgba(255,178,31,.12)} .pill.bad{color:var(--bad);background:rgba(255,74,92,.12)} .pill.ok{color:var(--ok);background:rgba(53,212,135,.12)}
.sub .dates{font-size:17px;font-weight:700;margin:10px 0 2px}
.sub .info{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:14px}
.sub .info .unpaid{color:var(--bad);font-weight:700}
.sub .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sub.old{opacity:.78}

/* Feuille de saisie */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:relative;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:18px 18px calc(24px + var(--sab));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 16px;font-family:var(--disp);font-size:20px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.locked{padding:13px 14px;border-radius:12px;background:var(--s2);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{position:relative;text-align:left;padding:14px;border-radius:16px;color:#fff;background:var(--svc);opacity:.5;border:2px solid transparent;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:15.5px;font-weight:700;line-height:1.2}
.tile span{font-size:13.5px;opacity:.92;font-weight:600}
.tile.on{opacity:1;border-color:#fff}
.tile.on::after{content:"✓";position:absolute;top:8px;right:11px;font-weight:800}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.seg{padding:11px 6px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);font-weight:700;display:flex;flex-direction:column;align-items:center}
.seg small{font-weight:500;color:var(--mut);font-size:12px}
.seg.on{border-color:#4b6bff;box-shadow:inset 0 0 0 1px #4b6bff}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.hint{font-size:13px;color:var(--mut);margin-top:2px}
.endbox{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;background:var(--s2);margin-bottom:16px}
.endbox b{font-family:var(--disp);font-size:15px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-weight:600}
.check input{width:22px;height:22px;padding:0}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}

/* Réglages */
.panel{background:var(--s1);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel p{margin:0 0 12px;color:var(--mut);font-size:14.5px}
.state{font-weight:700;margin-bottom:12px}
.state.ok{color:var(--ok)} .state.bad{color:var(--warn)}

.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1.5px solid var(--line)}
.iconbtn svg{width:20px;height:20px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0 12px;border-radius:14px;background:rgba(255,178,31,.12);border:1.5px solid rgba(255,178,31,.45);color:var(--warn);font-weight:600;font-size:14.5px;line-height:1.35}
.banner.bad{background:rgba(255,74,92,.12);border-color:rgba(255,74,92,.5);color:var(--bad)}
.note{color:var(--mut);font-size:14.5px;margin:10px 0 14px}
.prof{font-weight:700;color:var(--tx)}
.segs.four{grid-template-columns:repeat(4,1fr)}
.pfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pf{padding:9px 8px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;min-width:0;color:var(--tx)}
.pf b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf small{font-size:11.5px;color:var(--ok);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf.busy small,.pf.none small{color:var(--mut)}
.pf.on{opacity:1;border-color:#4b6bff;box-shadow:inset 0 0 0 1px #4b6bff}
.pfsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.pfsum div{padding:12px;border-radius:14px;background:var(--svc);color:#fff}
.pfsum b{display:block;font-family:var(--disp);font-size:26px;line-height:1.1}
.pfsum span{font-size:12.5px;font-weight:600;opacity:.92}
.pt{padding:10px;border-radius:14px;background:var(--s1);border:1.5px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;color:var(--tx)}
.pt b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt span{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mut)}
.pt.free{border-color:rgba(53,212,135,.6);border-style:dashed} .pt.free em{color:var(--ok)}
.pt.warn{border-color:rgba(255,178,31,.65)} .pt.warn em{color:var(--warn)}
.pt.bad{border-color:rgba(255,74,92,.7)} .pt.bad em{color:var(--bad)}
.svch{margin:20px 0 10px}
.pick{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:11px 13px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);margin-bottom:7px;color:var(--tx)}
.pick b{font-size:16px}
.pick small{color:var(--mut);font-size:13px;font-weight:500}
.pick.new{border-style:dashed;border-color:#4b6bff}
.pick.contact small::before{content:"📇 ";}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.cres{max-height:240px;overflow-y:auto;margin-bottom:12px}
.chosen{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chosen small{display:block;color:var(--mut);font-weight:500}
.occrow{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;background:var(--s2);border-radius:12px}
.occrow .main{flex:1;min-width:0;cursor:pointer}
.occrow strong{display:block}
.occrow small{color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translateX(-50%);background:#fff;color:#0b0d14;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14.5px;z-index:80;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>

<div id="boot" class="boot"><div class="logo">VISION</div></div>

<!-- Connexion -->
<section id="login" class="login" hidden>
  <div class="logo">VISION<small>streaming</small></div>
  <p>Connecte-toi pour gérer tes abonnements.</p>
  <form id="loginForm" autocomplete="on">
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pass">Mot de passe</label><input id="pass" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr"></p>
    <button class="btn primary" type="submit">Se connecter</button>
  </form>
</section>

<!-- Application -->
<div id="app" hidden>
  <header class="top"><div class="logo">VISION<small>streaming</small></div><button class="iconbtn" data-act="tab" data-tab="settings" aria-label="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
  <main id="view"></main>

  <button class="fab" data-act="fab" aria-label="Ajouter"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabs"><div class="in">
    <button class="tab on" data-act="tab" data-tab="subs"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Abonnements</button>
    <button class="tab" data-act="tab" data-tab="clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 5a3.2 3.2 0 0 1 0 6M18.5 14.8c1.7.7 2.7 2.3 3 5.2"/></svg>Clients</button>
    <button class="tab" data-act="tab" data-tab="profiles"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Profils</button>
    <button class="tab" data-act="tab" data-tab="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5h18M7 15h3"/></svg>Mes comptes</button>
  </div></nav>

  <div id="detail" class="page" hidden></div>
  <div id="sheet" class="sheetwrap" hidden><div class="backdrop" data-act="close-sheet"></div><div class="sheet" id="sheetBody"></div></div>
</div>
<input type="file" id="vcf" accept=".vcf,text/vcard,text/x-vcard,text/directory" multiple hidden>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
/* ============ Réglages métier (modifiables) ============ */
const DEFAULT_CC = '243'; // indicatif pays ajouté aux numéros locaux (RDC)
const SERVICES = {
  netflix:     { label:'Netflix',                bg:'linear-gradient(135deg,#e50914,#7d0610)', dot:'#e50914' },
  prime:       { label:'Prime Video',            bg:'linear-gradient(135deg,#1fb4f0,#0a4aa6)', dot:'#1a98ff' },
  crunchyroll: { label:'Crunchyroll',            bg:'linear-gradient(135deg,#f47521,#ff4a3a)', dot:'#f47521' },
  combo:       { label:'Combo Netflix + Prime',  bg:'linear-gradient(110deg,#e50914,#0a3a8a)', dot:'#8d2a6b' }
};
const PRICES = {
  netflix:     { 1:12000, 3:36000,  6:72000 },
  prime:       { 1:9000,  3:27000,  6:54000 },
  crunchyroll: { 1:12000, 3:36000,  6:72000 },
  combo:       { 1:18000, 3:54000,  6:108000 }
};
const TIERS = [30, 90, 180]; // paliers 1, 3 et 6 mois
const FREE_AFTER_DAYS = 1;    // le client n'a pas renouvelé depuis 1 jour : on le retire de son profil
const ARCHIVE_AFTER_DAYS = 3; // depuis 3 jours : on l'archive automatiquement
const METHODS = ['Illicocash','Orange Money','Airtel Money','Cash','Autre'];
const DEFAULT_TEMPLATE = "Bonjour {nom} 👋\nVotre abonnement {service} chez Vision Streaming {quand} (le {date}).\nSouhaitez-vous le renouveler ? Merci !";

const SHORT = { netflix:'Netflix', prime:'Prime Video', crunchyroll:'Crunchyroll' };
// Profils de chaque service (modifie les nombres ou les préfixes ici si besoin)
const PROFILE_SETS = {

/* Recherche : sans accents ni majuscules, nom ou numéro */
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const digitsOf = (s) => String(s || '').replace(/\D/g, '');
function matchQ(q, texts, phone) {
  const t = String(q || '').trim(), nq = norm(t);
  if (!nq) return true;
  if (texts.some((x) => norm(x).includes(nq))) return true;
  if (phone && /^[\d\s+().-]+$/.test(t) && digitsOf(t).length >= 2) return waNumber(phone).includes(waNumber(t));
  return false;
}

/* Contacts du téléphone (importés d'un fichier .vcf, gardés sur cet appareil) */
const CONTACTS_KEY = 'visionContacts';
const canPickContact = () => 'contacts' in navigator && 'ContactsManager' in window;
function loadContacts() { try { return JSON.parse(localStorage.getItem(CONTACTS_KEY) || '[]'); } catch (e) { return []; } }
let contacts = loadContacts();
function saveContacts() { try { localStorage.setItem(CONTACTS_KEY, JSON.stringify(contacts)); return true; } catch (e) { return false; } }
function parseVcf(text) {
  const out = [], un = (v) => v.replace(/\\([,;])/g, '$1').replace(/\\n/gi, ' ').trim();
  text.replace(/\r\n?/g, '\n').replace(/\n[ \t]/g, '').split(/BEGIN:VCARD/i).slice(1).forEach((card) => {
    let name = '', org = ''; const tels = [];
    card.split('\n').forEach((line) => {
      const m = line.match(/^(?:[\w-]+\.)?([A-Za-z-]+)(?:;[^:]*)?:(.*)$/); if (!m) return;
      const key = m[1].toUpperCase(), val = m[2].trim();
      if (key === 'FN' && !name) name = un(val);
      else if (key === 'N' && !name) { const p = val.split(';'); name = un([p[1], p[0]].filter(Boolean).join(' ')); }
      else if (key === 'ORG' && !org) org = un(val.split(';')[0]);
      else if (key === 'TEL') tels.push(val.replace(/^tel:/i, '').trim());
    });
    tels.forEach((t) => { if (digitsOf(t).length >= 6) out.push({ name: name || org || t, phone: t }); });
  });
  return out;
}
async function importVcf(files) {
  let added = 0;
  try {
    const known = new Map(contacts.map((c) => [waNumber(c.phone), c]));
    for (const f of files) {
      parseVcf(await f.text()).forEach((c) => { const k = waNumber(c.phone); if (!known.has(k)) added++; known.set(k, c); });
    }
    contacts = [...known.values()].sort(byName);
    if (!saveContacts()) return toast('Mémoire de l\'appareil pleine, import impossible');
  } catch (err) { console.error(err); return toast('Fichier illisible'); }
  toast(`${contacts.length} contact${contacts.length > 1 ? 's' : ''} disponibles (${added} nouveau${added > 1 ? 'x' : ''}) ✓`);
  if (form) showSheet(subFormHTML()); else if (cform) showSheet(clientFormHTML()); else render();
}
async function pickDeviceContact() {
  try {
    const r = await navigator.contacts.select(['name', 'tel'], { multiple:false });
    if (r && r[0]) applyContact(((r[0].name || [])[0] || '').trim(), ((r[0].tel || [])[0] || '').trim());
  } catch (err) { console.error(err); toast('Contacts indisponibles sur cet appareil'); }
}
function applyContact(name, phone) {

    const ex = phone && clients.find((c) => c.phone && waNumber(c.phone) === waNumber(phone));
    if (ex) { form.clientId = ex.id; autoPick(form.profiles); toast('Ce client existe déjà : ' + ex.name); }

}

function enrich() {
  const latest = {};
  subs.forEach((s) => { const k = s.clientId + '|' + s.service; if (!latest[k] || s.endDate > latest[k]) latest[k] = s.endDate; });
  const t = todayStr();
  subs.forEach((s) => { s._current = s.endDate === latest[s.clientId + '|' + s.service]; s._left = diffDays(t, s.endDate); });
}
const statusOf = (s) => s._left < 0 ? 'expired' : s._left <= 3 ? 'soon' : 'active';
const isVisible = (s) => s._current && !s.archived;

/* ----- Profils ----- */
const defaultName = (id) => { const [svc, n] = id.split('-'); return `${PROFILE_SETS[svc].prefix} ${n}`; };
const profName = (id) => profileNames[id] || defaultName(id);
const allProfiles = (svc) => Array.from({ length:PROFILE_SETS[svc].count }, (_, i) => `${svc}-${i + 1}`);
const hasProf = (s) => Object.values(s.profiles || {}).some(Boolean);
const profLabel = (s) => Object.values(s.profiles || {}).filter(Boolean).map(profName).join(' + ');
const profTag = (s) => hasProf(s) ? `<span class="prof">${esc(profLabel(s))}</span>` : '';
// Un profil peut avoir plusieurs clients : occ[id] = liste d'abonnements (hors expirés, déjà retirés)
function occupancy() {
  const occ = {};
  subs.filter((s) => isVisible(s) && s._left >= 0).forEach((s) => Object.values(s.profiles || {}).forEach((id) => { if (id) (occ[id] = occ[id] || []).push(s); }));
  return occ;
}
const freedLabel = (s) => Object.values(s.freedProfiles || {}).filter(Boolean).map(profName).join(' + ');
function freedBanner() {
  const t = todayStr();
  const rec = subs.filter((s) => s.freedAt && s.freedProfiles && freedLabel(s) && diffDays(s.freedAt, t) <= 2);
  if (!rec.length) return '';
  return `<div class="banner">🔓 Places libérées : ${rec.map((s) => `${esc(s.clientName)} retiré de ${esc(freedLabel(s))}`).join(', ')}</div>`;
}
/* Retire automatiquement les clients qui n'ont pas renouvelé (profil libéré à J+1, archivage à J+3) */
function autoMaintain() {
  const t = todayStr(), batch = db.batch(), freed = []; let n = 0;
  subs.forEach((s) => {
    if (!s._current || s.archived || pendingAuto.has(s.id)) return;
    const arch = s._left <= -ARCHIVE_AFTER_DAYS, free = s._left <= -FREE_AFTER_DAYS && hasProf(s);
    if (!arch && !free) return;
    const upd = {};
    if (hasProf(s)) { upd.profiles = {}; upd.freedProfiles = { ...s.profiles }; upd.freedAt = t; freed.push(`${s.clientName} (${profLabel(s)})`); }
    if (arch) { upd.archived = true; upd.archivedAt = t; }
    batch.update(db.doc('subscriptions/' + s.id), upd); pendingAuto.add(s.id); n++;
  });
  if (!n) return;
  batch.commit().then(() => {
    if (freed.length === 1) toast(`🔓 ${freed[0].replace(' (', ' retiré de ').replace(/\)$/, '')} : la place est libérée`, 6000);
    else if (freed.length) toast(`🔓 ${freed.length} clients retirés de leurs profils : places libérées`, 6000);
  }).catch((err) => { console.error(err); pendingAuto.clear(); });
}

/* ----- Durées et prix ----- */
const subDays = (s) => Number(s.days) || Math.round(Number(s.months || 1) * 30);
function durLabel(s) {
  const d = subDays(s);
  if (TIERS.includes(d)) return `${d / 30} mois`;
  return d % 30 === 0 ? `${d / 30} mois (${d} j)` : `${d} jours`;
}
function priceFor(svc, days) {
  if (!(days > 0)) return 0;
  const tier = { 30:1, 90:3, 180:6 }[days];
  return tier ? PRICES[svc][tier] : Math.round(PRICES[svc][1] * days / 30);
}
const fmtShort = (s) => new Date(toUTC(s)).toLocaleDateString('fr-FR', { day:'numeric', month:'short', timeZone:'UTC' });

/* ----- Mes comptes (ceux que je paie) ----- */
const accPayUrl = (a) => a.payUrl || PAY_URLS[a.service] || '';
const accLeft = (a) => a.endDate ? diffDays(todayStr(), a.endDate) : null;
const accNext = (a) => a.endDate ? addDays(a.endDate >= todayStr() ? a.endDate : todayStr(), Math.max(1, Math.round(Number(a.cycleDays)) || 30)) : '';
function accLabel(d) {
  if (d === null) return 'Date à renseigner';
  if (d < 0) return d === -1 ? "En retard d'un jour" : `En retard de ${-d} jours`;
  if (d === 0) return "À payer aujourd'hui";
  if (d === 1) return 'À payer demain';
  return `Dans ${d} jours`;
}
const accCls = (d) => d === null ? '' : d < 0 ? 'bad' : d <= 2 ? 'warn' : 'ok';
function accBanner() {
  const due = accounts.filter((a) => { const d = accLeft(a); return d !== null && d <= 2; }).sort((a, b) => a.endDate.localeCompare(b.endDate));
  if (!due.length) return '';
  const txt = due.map((a) => { const d = accLeft(a); return `${esc(a.name)} (${d < 0 ? 'en retard' : d === 0 ? "aujourd'hui" : d === 1 ? 'demain' : 'dans ' + d + ' jours'})`; }).join(', ');
  return `<button class="banner ${due.some((a) => accLeft(a) <= 0) ? 'bad' : ''}" data-act="tab" data-tab="accounts">💳 Comptes à renouveler : ${txt}</button>`;
}

function leftLabel(s) {
  const d = s._left;
  if (d < 0) return d === -1 ? 'Expiré hier' : `Expiré depuis ${-d} j`;
  if (d === 0) return "Finit aujourd'hui";
  if (d === 1) return 'Finit demain';
  return `Encore ${d} jours`;
}

/* ============ WhatsApp ============ */
function waNumber(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = DEFAULT_CC + d.slice(1);
  else if (d.length === 9) d = DEFAULT_CC + d;
  return d;
}
function fillTemplate(tpl, s) {
  const d = s._left;
  const quand = d < 0 ? (d === -1 ? "s'est terminé hier" : `s'est terminé il y a ${-d} jours`)
    : d === 0 ? "se termine aujourd'hui" : d === 1 ? 'se termine demain' : `se termine dans ${d} jours`;
  return tpl.replaceAll('{nom}', s.clientName).replaceAll('{service}', (SERVICES[s.service] || {}).label || s.service)
    .replaceAll('{date}', fmtDate(s.endDate)).replaceAll('{quand}', quand);
}
function waHref(s) {
  const c = clientById(s.clientId);
  if (!c || !c.phone) return '';
  return `https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(fillTemplate(template, s))}`;
}
const WA_ICON = '<svg viewBox="0 0 24 24"><path d="M12.04 2a9.9 9.9 0 0 0-8.5 14.9L2 22l5.25-1.5A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.35-2 1.4-.5.05-1.1.2-3.6-.8-3-1.2-4.9-4.2-5.05-4.4-.15-.2-1.2-1.6-1.2-3s.75-2.1 1-2.4c.25-.3.55-.35.75-.35h.55c.18 0 .42-.07.65.5.25.6.85 2.05.9 2.2.08.15.12.33.02.52-.1.2-.15.32-.3.5l-.45.5c-.15.15-.3.3-.13.6.17.3.78 1.28 1.68 2.07 1.15 1 2.12 1.32 2.42 1.47.3.15.47.12.65-.07.18-.2.75-.88.95-1.18.2-.3.4-.25.68-.15.28.1 1.75.83 2.05.98.3.15.5.22.57.35.08.12.08.72-.17 1.42z"/></svg>';
const waBtn = (s) => { const h = waHref(s); return h ? `<a class="wa" href="${h}" target="_blank" rel="noopener" aria-label="Écrire sur WhatsApp">${WA_ICON}</a>` : `<span class="wa off">${WA_ICON}</span>`; };

const matchClient = (c, q) => matchQ(q, [c.name, c.note || ''], c.phone);

/* ============ Feuille d'abonnement ============ */
function showSheet(html) {
  const b = $('#sheetBody'), st = b.scrollTop;
  b.innerHTML = html; $('#sheet').hidden = false; b.scrollTop = st;
}
function closeSheet() { $('#sheet').hidden = true; form = null; cform = null; bform = null; }

function formOcc() {
  const f = form, occ = {};
  subs.filter((s) => isVisible(s) && s._left >= 0).forEach((s) => {
    if (s.id === f.id) return;
    if (f.clientId && s.clientId === f.clientId && s.service === f.service) return; // renouvellement du même client
    Object.values(s.profiles || {}).forEach((id) => { if (id) (occ[id] = occ[id] || []).push(s); });
  });
  return occ;
}
// Garde le profil demandé (on peut le partager) ; sinon propose le premier profil entièrement libre
function autoPick(prev) {
  const f = form, occ = formOcc(), next = {};
  COMPONENTS[f.service].forEach((svc) => {
    const p = (prev || {})[svc];
    next[svc] = p && p.startsWith(svc + '-') ? p : (allProfiles(svc).find((id) => !(occ[id] || []).length) || '');
  });
  f.profiles = next;
}
const formEnd = (f) => addDays(f.start || todayStr(), (f.days > 0 ? f.days : 0) + (f.bonus || 0));
function openSubForm(o = {}) {

    const d = o.days || 30;
    form = { id:null, clientId:o.clientId || '', service:o.service || 'netflix', days:d, bonus:0, cq:'', custom:!TIERS.includes(d), price:'', priceTouched:false, method:o.method || 'Orange Money', paid:true, start:o.start || todayStr(), note:o.note || '', lock:!!o.clientId, newName:'', newPhone:'', profiles:{} };
    form.price = priceFor(form.service, form.days);

  showSheet(subFormHTML());
}

    <div class="field"><label>Somme à payer</label><input data-f="price" type="number" inputmode="numeric" min="0" value="${esc(f.price)}"><span class="hint" id="priceHint">${esc(priceHintText())}</span></div>
    <div class="field"><label>Moyen de paiement</label></div><div class="wrapchips">${methods}</div>
    <label class="check"><input type="checkbox" data-f="paid" ${f.paid ? 'checked' : ''}>Payé</label>
    <div class="field"><label>Début</label><input data-f="start" type="date" value="${esc(f.start)}"></div>
    <div class="endbox"><span>Fin de l'abonnement</span><b id="endLabel">${fmtDate(end)}</b></div>
    <div class="field"><label>Note (email du compte…)</label><input data-f="note" value="${esc(f.note)}" autocomplete="off"></div>
    <div class="stack"><button class="btn primary" data-act="save-sub">Enregistrer</button>
    ${f.id ? `<button class="btn danger" data-act="del-sub" data-sid="${f.id}">Supprimer cet abonnement</button>` : ''}
    <button class="btn" data-act="close-sheet">Annuler</button></div>`;
}
async function saveSub() {
  const f = form; if (!f || f.saving) return;
  if (!f.clientId) return toast('Choisis un client');
  if (!(f.days >= 1)) return toast('Indique le nombre de jours');
  const price = Number(f.price);
  if (f.price === '' || !(price >= 0)) return toast('Somme invalide');
  if (!f.start) return toast('Indique la date de début');
  const newName = (f.newName || '').trim(), newPhone = (f.newPhone || '').trim();
  if (f.clientId === '__new' && (!newName || !newPhone)) return toast('Nom et numéro WhatsApp requis');
  f.saving = true;
  try {
    let clientId = f.clientId, clientName;
    if (clientId === '__new') {
      const ref = await db.collection('clients').add({ name:newName, phone:newPhone, note:'', createdAt:TS() });
      clientId = ref.id; clientName = newName;
    } else clientName = clientById(clientId).name;
    const profiles = {};
    COMPONENTS[f.service].forEach((svc) => { if (f.profiles[svc]) profiles[svc] = f.profiles[svc]; });
    const data = { clientId, clientName, service:f.service, days:f.days, bonusDays:f.bonus || 0, months:Math.round(f.days / 30 * 100) / 100, price, method:f.method, paid:!!f.paid,
      startDate:f.start, endDate:formEnd(f), profiles, note:(f.note || '').trim() };
    if (f.id) await db.doc('subscriptions/' + f.id).update(data);
    else await db.collection('subscriptions').add({ ...data, archived:false, createdAt:TS() });
    closeSheet(); toast('Abonnement enregistré ✓');
  } catch (err) { console.error(err); f.saving = false; toast('Erreur : ' + (err.message || err)); }
}

function openBonus(sb) {
  bform = { sid:sb.id, n:0 };
  showSheet(`<h3>Jours de non-service</h3>
    <p class="note" style="margin-top:-8px">${esc(sb.clientName)}, ${(SERVICES[sb.service] || {}).label}. Fin actuelle : ${fmtDate(sb.endDate)}${Number(sb.bonusDays) > 0 ? ` (déjà ${Number(sb.bonusDays)} j offerts)` : ''}.</p>
    <div class="field"><label>Nombre de jours à rajouter</label><input data-b="n" type="number" inputmode="numeric" min="1" placeholder="ex. 5" autocomplete="off"><span class="hint" id="bonusHint">Indique les jours où le compte n'a pas marché.</span></div>
    <div class="stack"><button class="btn primary" data-act="save-bonus">Ajouter ces jours</button><button class="btn" data-act="close-sheet">Annuler</button></div>`);
}
async function saveBonus() {
  const f = bform, sb = f && subs.find((x) => x.id === f.sid); if (!sb) return;
  const n = Math.round(Number(f.n));
  if (!(n >= 1)) return toast('Indique le nombre de jours');
  try {
    await db.doc('subscriptions/' + sb.id).update({ bonusDays:(Number(sb.bonusDays) || 0) + n, endDate:addDays(sb.endDate, n) });
    closeSheet(); toast(`${n} jour${n > 1 ? 's' : ''} ajouté${n > 1 ? 's' : ''} : fin le ${fmtDate(addDays(sb.endDate, n))} ✓`, 4000);
  } catch (err) { console.error(err); toast('Erreur : ' + (err.message || err)); }
}

/* ============ Feuille client ============ */
function ccresHTML() {
  const q = (cform.cq || '').trim(); if (!q) return '';
  const known = new Set(clients.map((c) => waNumber(c.phone)));
  const ct = contacts.map((c, i) => ({ ...c, i })).filter((c) => matchQ(q, [c.name], c.phone) && !known.has(waNumber(c.phone))).slice(0, 12);
  return ct.length ? ct.map((c) => `<button class="pick contact" data-act="fill-contact" data-i="${c.i}"><b>${esc(c.name)}</b><small>${esc(c.phone)}</small></button>`).join('') : '<p class="hint">Aucun contact trouvé.</p>';
}
function openClientForm(c) {
  cform = c ? { id:c.id, name:c.name, phone:c.phone || '', note:c.note || '', cq:'' } : { id:null, name:'', phone:'', note:'', cq:'' };
  showSheet(clientFormHTML());
}
function clientFormHTML() {
  const c = cform.id ? clientById(cform.id) : null;
  return (`<h3>${c ? 'Modifier le client' : 'Nouveau client'}</h3>
    ${c ? '' : `<div class="field"><label>Chercher dans mes contacts</label><input data-c="cq" type="search" value="${esc(cform.cq)}" placeholder="Nom ou numéro" autocomplete="off"></div>
    <div class="pickrow">${canPickContact() ? '<button class="btn small" data-act="pick-device-contact">📇 Mes contacts</button>' : ''}<button class="btn small" data-act="import-contacts">${contacts.length ? `Contacts (${contacts.length}) : réimporter` : 'Importer mes contacts'}</button></div>
    <div class="cres" id="ccres">${ccresHTML()}</div>`}
    <div class="field"><label>Nom</label><input data-c="name" value="${esc(cform.name)}" autocomplete="off"></div>
    <div class="field"><label>Numéro WhatsApp</label><input data-c="phone" type="tel" value="${esc(cform.phone)}" placeholder="081 234 5678"></div>
    <div class="field"><label>Note</label><input data-c="note" value="${esc(cform.note)}" autocomplete="off"></div>
    <div class="stack"><button class="btn primary" data-act="save-client">Enregistrer</button>
    ${c ? `<button class="btn danger" data-act="del-client" data-id="${c.id}">Supprimer ce client</button>` : ''}
    <button class="btn" data-act="close-sheet">Annuler</button></div>`);
}
async function saveClient() {
  const f = cform; if (!f || f.saving) return;
  const name = f.name.trim(), phone = f.phone.trim();
  if (!name || !phone) return toast('Nom et numéro WhatsApp requis');
  f.saving = true;
  try {
    if (f.id) {
      const batch = db.batch();
      batch.update(db.doc('clients/' + f.id), { name, phone, note:f.note.trim() });
      subs.filter((s) => s.clientId === f.id && s.clientName !== name).forEach((s) => batch.update(db.doc('subscriptions/' + s.id), { clientName:name }));
      await batch.commit();
    } else await db.collection('clients').add({ name, phone, note:f.note.trim(), createdAt:TS() });
    closeSheet(); toast('Client enregistré ✓');
  } catch (err) { console.error(err); f.saving = false; toast('Erreur : ' + (err.message || err)); }
}

/* ============ Notifications push ============ */
async function enableNotifications() {
  const ns = notifState();
  if (!('Notification' in window) || !messaging) return toast(ns.txt.length < 90 ? ns.txt : 'Ajoute d\'abord l\'app à l\'écran d\'accueil');
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { render(); return toast('Notifications refusées'); }
    const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey:VAPID_KEY, serviceWorkerRegistration:reg });
    if (!token) throw new Error('Aucun jeton reçu');
    await db.doc('settings/push').set({ tokens: firebase.firestore.FieldValue.arrayUnion(token) }, { merge:true });
    localStorage.setItem('fcm', token);
    toast('Notifications activées ✓'); render();
  } catch (err) { console.error(err); toast('Erreur : ' + (err.message || err)); }
}
if (messaging) messaging.onMessage((p) => { const d = p.data || {}; toast((d.title || '') + ' ' + (d.body || '')); });

/* ============ Événements ============ */
document.addEventListener('click', async (e) => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const { act, id, sid, v } = el.dataset;
  const sub = sid ? subs.find((s) => s.id === sid) : null;
  switch (act) {
    case 'tab': ui.tab = el.dataset.tab; ui.detail = null; ui.q = ''; render(); window.scrollTo(0, 0); break;
    case 'status': ui.status = v; render(); break;
    case 'service': ui.service = v; render(); break;
    case 'open-client': ui.detail = id; render(); $('#detail').scrollTop = 0; break;
    case 'back': ui.detail = null; render(); break;
    case 'new-sub': openSubForm({ clientId: ui.detail || '' }); break;
    case 'new-client': openClientForm(null); break;
    case 'edit-client': openClientForm(clientById(id)); break;
    case 'edit-sub': if (sub) openSubForm({ sub }); break;
    case 'renew-sub': if (sub) openSubForm({ clientId:sub.clientId, service:sub.service, days:subDays(sub), method:sub.method, note:sub.note, profiles:hasProf(sub) ? sub.profiles : (sub.freedProfiles || {}), start: sub._left > 0 ? sub.endDate : todayStr() }); break;
    case 'bonus-sub': if (sub) openBonus(sub); break;
    case 'save-bonus': saveBonus(); break;
    case 'archive-sub': if (sub) { await db.doc('subscriptions/' + sid).update({ archived:true, ...(hasProf(sub) ? { profiles:{}, freedProfiles:{ ...sub.profiles }, freedAt:todayStr() } : {}) }); toast(hasProf(sub) ? 'Profil libéré ✓' : 'Archivé (visible dans l\'historique)'); } break;
    case 'fab': if (ui.tab === 'accounts') openAccForm(null); else openSubForm({ clientId: ui.detail || '' }); break;
    case 'pick-service': form.service = v; form.priceTouched = false; form.price = priceFor(v, form.days); autoPick(form.profiles); showSheet(subFormHTML()); break;
    case 'pick-days':
      if (v === 'custom') form.custom = true; else { form.custom = false; form.days = Number(v); }
      form.priceTouched = false; form.price = priceFor(form.service, form.days); showSheet(subFormHTML()); break;
    case 'pick-profile': form.profiles[el.dataset.svc] = v; showSheet(subFormHTML()); break;
    case 'open-profile': openProfileSheet(id); break;
    case 'save-pname': savePname(id, false); break;
    case 'reset-pname': savePname(id, true); break;
    case 'goto-client': closeSheet(); ui.detail = id; render(); $('#detail').scrollTop = 0; break;
    case 'sub-on-profile': { const svc = id.split('-')[0]; closeSheet(); openSubForm({ service:svc, profiles:{ [svc]:id } }); break; }
    case 'remove-from-profile': {
      if (!sub) break;
      const upd = {};
      Object.entries(sub.profiles || {}).forEach(([svc, pid]) => { if (pid === id) upd['profiles.' + svc] = firebase.firestore.FieldValue.delete(); });
      if (!Object.keys(upd).length) break;
      if (!confirm(`Retirer ${sub.clientName} du profil ${profName(id)} ? Son abonnement reste actif.`)) break;
      await db.doc('subscriptions/' + sid).update(upd); closeSheet(); toast(`${sub.clientName} retiré de ${profName(id)} ✓`);
      break;
    }
    case 'pick-client': form.clientId = id; autoPick(form.profiles); showSheet(subFormHTML()); break;
    case 'pick-new': { const q = (form.cq || '').trim(); form.clientId = '__new'; if (/^[\d\s+().-]+$/.test(q) && digitsOf(q).length >= 3) form.newPhone = q; else form.newName = q; showSheet(subFormHTML()); break; }
    case 'pick-contact': { const c = contacts[Number(el.dataset.i)]; if (c) applyContact(c.name, c.phone); break; }
    case 'fill-contact': { const c = contacts[Number(el.dataset.i)]; if (c) applyContact(c.name, c.phone); break; }
    case 'change-client': form.clientId = ''; form.cq = ''; showSheet(subFormHTML()); break;
    case 'pick-device-contact': pickDeviceContact(); break;
    case 'import-contacts': $('#vcf').click(); break;
    case 'clear-contacts': if (confirm('Supprimer les contacts importés sur cet appareil ?')) { contacts = []; saveContacts(); toast('Contacts supprimés'); render(); } break;
    case 'new-acc': openAccForm(null); break;
    case 'edit-acc': openAccForm(accounts.find((a) => a.id === id)); break;
    case 'save-acc': saveAcc(); break;
    case 'del-acc': if (confirm('Supprimer ce compte ?')) { await db.doc('accounts/' + id).delete(); closeSheet(); toast('Compte supprimé'); } break;
    case 'renew-acc': {
      const a = accounts.find((x) => x.id === id), nx = a && accNext(a);
      if (a && nx && confirm(`Tu as payé ${a.name} ? La nouvelle fin sera le ${fmtDate(nx)}.`)) { await db.doc('accounts/' + id).update({ endDate:nx }); toast('Renouvelé jusqu\'au ' + fmtDate(nx) + ' ✓'); }
      break;
    }
    case 'seed-acc': {
      const batch = db.batch();
      ACCOUNT_SEED.forEach((sd) => batch.set(db.collection('accounts').doc(), { ...sd, cycleDays:30, createdAt:TS() }));
      await batch.commit(); toast('5 comptes créés avec leurs dates ✓');
      break;
    }
    case 'fill-acc': {
      const batch = db.batch(); let n = 0;
      seedMissing().forEach((sd) => {
        const a = accounts.find((x) => seedKey(x.name) === seedKey(sd.name));
        batch.update(db.doc('accounts/' + a.id), { endDate:sd.endDate, ...(a.note ? {} : { note:sd.note }) }); n++;
      });
      if (n) { await batch.commit(); toast(`${n} date${n > 1 ? 's' : ''} remplie${n > 1 ? 's' : ''} ✓`); }
      break;
    }
    case 'pick-method': form.method = v; showSheet(subFormHTML()); break;
    case 'save-sub': saveSub(); break;
    case 'save-client': saveClient(); break;
    case 'del-sub':
      if (confirm('Supprimer définitivement cet abonnement ?')) { await db.doc('subscriptions/' + sid).delete(); closeSheet(); toast('Supprimé'); }
      break;
    case 'del-client': {
      const c = clientById(id);
      if (c && confirm(`Supprimer ${c.name} et tous ses abonnements ?`)) {
        const batch = db.batch();
        subs.filter((s) => s.clientId === id).forEach((s) => batch.delete(db.doc('subscriptions/' + s.id)));
        batch.delete(db.doc('clients/' + id));
        await batch.commit(); ui.detail = null; closeSheet(); toast('Client supprimé');
      }
      break;
    }
    case 'close-sheet': closeSheet(); break;
    case 'enable-notif': enableNotifications(); break;
    case 'save-tpl': await db.doc('settings/app').set({ template: $('#tpl').value }, { merge:true }); toast('Message enregistré ✓'); break;
    case 'reset-tpl': await db.doc('settings/app').set({ template: DEFAULT_TEMPLATE }, { merge:true }); toast('Message réinitialisé'); break;
    case 'logout': auth.signOut(); break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.f === 'q') { ui.q = t.value; if (LISTS[ui.tab] && $('#clist')) $('#clist').innerHTML = LISTS[ui.tab](); return; }
  if (t.dataset.f === 'cq' && form) { form.cq = t.value; $('#cres').innerHTML = clientResultsHTML(); return; }
  if (t.dataset.b && bform) { bform.n = t.value; const h = $('#bonusHint'), sb = subs.find((x) => x.id === bform.sid), n = Math.round(Number(t.value)); if (h && sb) h.textContent = n >= 1 ? `Nouvelle fin : ${fmtDate(addDays(sb.endDate, n))}` : ''; return; }
  if (t.dataset.c && cform) { cform[t.dataset.c] = t.value; if (t.dataset.c === 'cq') { const r = $('#ccres'); if (r) r.innerHTML = ccresHTML(); } return; }
  if (t.dataset.a && aform) { aform[t.dataset.a] = t.value; const h = $('#accNext'); if (h) h.textContent = accHint(aform); return; }
  if (!t.dataset.f || !form || t.tagName === 'SELECT') return;
  const k = t.dataset.f;
  if (k === 'bonus') { form.bonus = Math.max(0, Math.round(Number(t.value) || 0)); refreshDerived(); return; }
  if (k === 'days') { form.days = Math.max(0, Math.round(Number(t.value) || 0)); form.priceTouched = false; form.price = priceFor(form.service, form.days); refreshDerived(); return; }
  form[k] = t.type === 'checkbox' ? t.checked : t.value;
  if (k === 'price') form.priceTouched = true;
  if (k === 'start') refreshDerived();
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'vcf') { const fl = [...t.files]; t.value = ''; if (fl.length) importVcf(fl); return; }
  if (t.dataset.f === 'start' && form) { form.start = t.value; refreshDerived(); }
  if (t.dataset.a && aform) { aform[t.dataset.a] = t.value; const h = $('#accNext'); if (h) h.textContent = accHint(aform); }
});
Object.assign(LISTS, { subs:subsListHTML, clients:clientListHTML, profiles:profilesListHTML, accounts:accountsListHTML });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });

/* ============ Connexion et données ============ */
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#loginErr').textContent = '';
  try { await auth.signInWithEmailAndPassword($('#email').value.trim(), $('#pass').value); }
  catch (err) { $('#loginErr').textContent = 'Email ou mot de passe incorrect.'; }
});

function start() {
  if (unsubs.length) return;
  const onErr = (err) => { console.error(err); toast('Accès refusé : vérifie les règles Firestore et ton email'); };
  unsubs.push(db.collection('clients').onSnapshot((s) => { clients = s.docs.map((d) => ({ id:d.id, ...d.data() })); loaded.c = true; render(); }, onErr));
  unsubs.push(db.collection('subscriptions').onSnapshot((s) => { subs = s.docs.map((d) => ({ id:d.id, ...d.data() })); loaded.s = true; render(); }, onErr));
  unsubs.push(db.collection('accounts').onSnapshot((s) => { accounts = s.docs.map((d) => ({ id:d.id, ...d.data() })); render(); }, onErr));
  unsubs.push(db.doc('settings/profiles').onSnapshot((d) => { profileNames = (d.exists && d.data().names) || {}; render(); }, onErr));
  unsubs.push(db.doc('settings/app').onSnapshot((d) => { template = (d.exists && d.data().template) || DEFAULT_TEMPLATE; if (ui.tab === 'settings' && document.activeElement.id !== 'tpl') render(); }, onErr));
}
function stop() { unsubs.forEach((u) => u()); unsubs = []; clients = []; subs = []; accounts = []; profileNames = {}; loaded = { c:false, s:false }; pendingAuto.clear(); ui.detail = null; closeSheet(); }

auth.onAuthStateChanged((u) => {
  $('#boot').hidden = true;
  $('#login').hidden = !!u; $('#app').hidden = !u;
  if (u) { start(); render(); } else stop();
});
</script>
</body>
